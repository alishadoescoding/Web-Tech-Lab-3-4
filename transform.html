<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Transform Gallery</title>
  <style>
    body {
      background-color: #fff5fa;
      font-family: 'Poppins', sans-serif;
      color: #444;
      text-align: center;
      margin: 40px;
    }

    h1 {
      color: #a06b9a;
      text-shadow: 1px 1px 3px #f3cce5;
    }

    .gallery {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 30px;
    }

    .box {
      width: 120px;
      height: 120px;
      background-color: #f9d9eb;
      border: 2px solid #f3cce5;
      border-radius: 10px;
      box-shadow: 3px 3px 10px #f0cbe1;
      transition: 0.4s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    /* Transform examples */
    .rotate:hover {
      transform: rotate(20deg);
    }

    .scale:hover {
      transform: scale(1.2);
    }

    .translate:hover {
      transform: translateY(-20px);
    }

    .skew:hover {
      transform: skewX(15deg);
    }

    .combo:hover {
      transform: rotate(10deg) scale(1.1) translateY(-10px);
    }
  </style>
</head>
<body>

  <h1>CSS Transform Gallery</h1>

  <div class="gallery">
    <div class="box rotate">Rotate</div>
    <div class="box scale">Scale</div>
    <div class="box translate">Translate</div>
    <div class="box skew">Skew</div>
    <div class="box combo">Combo</div>
  </div>

</body>
</html>

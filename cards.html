<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card Component Design</title>
  <style>
    body {
      background-color: #fff5fa;
      font-family: 'Poppins', sans-serif;
      color: #444;
      text-align: center;
      margin: 40px;
    }

    h1 {
      color: #a06b9a;
      text-shadow: 1px 1px 3px #f3cce5;
    }

    .card-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background-color: #fde6f0;
      border: 2px solid #f3cce5;
      border-radius: 12px;
      width: 250px;
      box-shadow: 4px 4px 10px #f0cbe1;
      transition: 0.3s;
    }

    .card img {
      width: 100%;
      height: 150px;
      border-radius: 10px 10px 0 0;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .card h3 {
      color: #8c5a93;
      margin-bottom: 5px;
    }

    .card p {
      font-size: 14px;
      color: #555;
    }

    .card button {
      margin-top: 10px;
      background-color: #cba4d4;
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }

    .card button:hover {
      background-color: #b685c0;
      transform: scale(1.05);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 6px 6px 15px #eacbe5;
    }
  </style>
</head>
<body>

  <h1>Card Component Design</h1>

  <div class="card-container">
    <div class="card">
      <img src="journal.png" alt="Product 1">
      <div class="card-content">
        <h3>Journal</h3>
        <p>notebook for journaling and sketches.</p>
        <button>Buy Now</button>
      </div>
    </div>

    <div class="card">
      <img src="mug.png" alt="Product 2">
      <div class="card-content">
        <h3>Mug</h3>
        <p>ceramic mug — perfect for your morning coffee.</p>
        <button>Shop Now</button>
      </div>
    </div>

    <div class="card">
      <img src="candle.png" alt="Product 3">
      <div class="card-content">
        <h3>Candle</h3>
        <p>scented candle to calm and relax your mind.</p>
        <button>View More</button>
      </div>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Styling</title>
  <style>
    body {
      background-color: #fff5fa;
      font-family: 'Poppins', sans-serif;
      color: #444;
      margin: 40px;
    }

    h1 {
      text-align: center;
      color: #a06b9a;
      text-shadow: 1px 1px 3px #f3cce5;
    }

    form {
      background-color: #fde6f0;
      width: 350px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 4px 4px 10px #f0cbe1;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 8px;
      border: 2px solid #f3cce5;
      border-radius: 6px;
      margin-top: 5px;
      font-family: inherit;
      transition: 0.3s;
    }

    input:focus, select:focus {
      border-color: #a06b9a;
      background-color: #fff0f6;
      outline: none;
    }

    .btn {
      margin-top: 15px;
      background-color: #cba4d4;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #b685c0;
      transform: scale(1.02);
    }

    /* Error & success states */
    .error {
      border-color: #e57373;
      background-color: #ffecec;
    }

    .success {
      border-color: #81c784;
      background-color: #ecffec;
    }

    .message {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
    }

    .error-text {
      background-color: #ffe5e5;
      color: #b94b4b;
    }

    .success-text {
      background-color: #e3ffe5;
      color: #388e3c;
    }
  </style>
</head>
<body>

  <h1>Registration Form</h1>

  <form>
    <label>Full Name:</label>
    <input type="text" placeholder="Enter your name">

    <label>Email:</label>
    <input type="email" class="error" placeholder="Invalid email">

    <label>Course:</label>
    <select>
      <option>Select Course</option>
      <option>Web Technologies</option>
      <option>Database Systems</option>
      <option>Operating Systems</option>
    </select>

    <button type="submit" class="btn">Submit</button>

    <div class="message error-text">Error: Please fix the highlighted fields.</div>
    <div class="message success-text">Success: Form submitted successfully!</div>
  </form>

</body>
</html>
